version: "3.8"

services:
  app:
    build: ./backend
    container_name: lms_app
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/apache.conf:/etc/apache2/sites-enabled/000-default.conf

  db:
    image: mysql:8.0
    container_name: lms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lms
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lms_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
